name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run pack:dry

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the runner browser prerequisite
        run: google-chrome --version
      - name: Example domains and graph interactions
        run: node test/browser-smoke.js --app examples/app.fwe.json --output artifacts/browser-smoke
      - name: Real editor create, save, conflict, and navigation lifecycle
        run: node test/browser-lifecycle.js --output artifacts/browser-lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: warn
